- name: Apply firewall policy with fail-safe recovery
  block:
    - name: Reset ufw to a known state
      ansible.builtin.command: ufw --force reset
      changed_when: false

    - name: Set default deny incoming
      ansible.builtin.command: ufw default deny incoming
      changed_when: false

    - name: Set default allow outgoing
      ansible.builtin.command: ufw default allow outgoing
      changed_when: false

    - name: Allow SSH during bootstrap from operator public IP
      ansible.builtin.command: "ufw allow from {{ bootstrap_allowed_ip }} to any port {{ ssh_port }} proto tcp"
      changed_when: false
      when:
        - hardening_phase == "bootstrap"
        - bootstrap_allowed_ip | length > 0

    - name: Allow SSH on tailscale interface only
      ansible.builtin.command: "ufw allow in on tailscale0 from {{ tailscale_ssh_cidr }} to any port {{ ssh_port }} proto tcp"
      changed_when: false

    - name: Allow inbound TCP service ports
      ansible.builtin.command: "ufw allow {{ item }}/tcp"
      changed_when: false
      loop: "{{ inbound_allowed_tcp_ports | default([]) }}"

    - name: Allow inbound UDP service ports
      ansible.builtin.command: "ufw allow {{ item }}/udp"
      changed_when: false
      loop: "{{ inbound_allowed_udp_ports | default([]) }}"

    - name: Capture numbered ufw status before lockdown cleanup
      ansible.builtin.command: ufw status numbered
      register: ufw_status_before_bootstrap_cleanup
      changed_when: false
      when:
        - hardening_phase == "lockdown"
        - bootstrap_allowed_ip | length > 0

    - name: Remove bootstrap SSH rule after lockdown
      ansible.builtin.command: "ufw --force delete allow from {{ bootstrap_allowed_ip }} to any port {{ ssh_port }} proto tcp"
      changed_when: false
      when:
        - hardening_phase == "lockdown"
        - bootstrap_allowed_ip | length > 0
        - bootstrap_allowed_ip in (ufw_status_before_bootstrap_cleanup.stdout | default(''))

    - name: Allow outgoing TCP ports
      ansible.builtin.command: "ufw allow out {{ item }}/tcp"
      changed_when: false
      loop: "{{ outbound_allowed_tcp_ports | default([]) }}"

    - name: Allow outgoing UDP ports
      ansible.builtin.command: "ufw allow out {{ item }}/udp"
      changed_when: false
      loop: "{{ outbound_allowed_udp_ports | default([]) }}"
  rescue:
    - name: Ensure tailscale SSH rule exists before rescue enable
      ansible.builtin.command: "ufw allow in on tailscale0 from {{ tailscale_ssh_cidr }} to any port {{ ssh_port }} proto tcp"
      changed_when: false
      failed_when: false

    - name: Re-add bootstrap SSH rule in rescue when available
      ansible.builtin.command: "ufw allow from {{ bootstrap_allowed_ip }} to any port {{ ssh_port }} proto tcp"
      changed_when: false
      failed_when: false
      when: bootstrap_allowed_ip | default('') | length > 0

    - name: Re-enable UFW when policy application fails
      ansible.builtin.command: ufw --force enable
      changed_when: false

    - name: Abort after firewall recovery attempt
      ansible.builtin.fail:
        msg: Firewall policy application failed; UFW was re-enabled to avoid fail-open exposure.
  always:
    - name: Ensure UFW is enabled
      ansible.builtin.command: ufw --force enable
      changed_when: false

    - name: Read UFW status after policy application
      ansible.builtin.command: ufw status
      register: ufw_status_after_policy
      changed_when: false

    - name: Assert UFW is active after policy application
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status_after_policy.stdout"
        fail_msg: UFW is not active after firewall policy application.
